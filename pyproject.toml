[project]
name = "PrivacyChatBoX"
version = "0.1.0"
description = "A privacy-focused AI chat platform built with Streamlit"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.12.0",
    "openai>=3.26.0",
    "streamlit>=1.44.0",
    "pytest>=8.0.0",
    "python-dotenv>=1.0.0",
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.0",
    "reportlab>=4.0.0",
    "pandas>=2.0.0",
    "google-genai>=2.29.0",
    "requests>=2.29.0",
    "serpapi>=1.1.2",
    "plotly>=6.0.1",
    "msal>=1.32.0",
    "llama-cpp-python>=0.3.8",
    "tqdm>=4.67.1",
    "pdfminer-six>=20221105",
    "python-docx>=1.0.0",
    "openpyxl>=3.1.2",
    "cryptography>=42.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
